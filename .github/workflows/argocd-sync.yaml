name: ArgoCD Sync Pipeline
on:
  push:
    branches: [ main, feature/deployment ]
    paths:
      - 'kubernetes/**'
      - 'helm/**'
      - 'argocd/**'
      - '.github/workflows/argocd-sync.yaml'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  ARGOCD_VERSION: v2.10.0
jobs:
  argocd-sync:
    name: Sync ArgoCD Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::527582557964:role/petclinic-dev-github-actions-role
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name petclinic-dev-eks --region us-east-1

      - name: Install ArgoCD CLI
        run: |
          curl -sSL https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64 -o /tmp/argocd
          chmod +x /tmp/argocd
          sudo mv /tmp/argocd /usr/local/bin/argocd
          argocd version --client

      - name: Login to ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}

      - name: Create or Update ArgoCD Application
        run: |
          argocd app create petclinic-dev \
            --repo https://github.com/petclinic-project/Group7-petclinic-project.git \
            --path helm/petclinic \
            --dest-server https://kubernetes.default.svc \
            --dest-namespace petclinic-dev \
            --revision feature/deployment \
            --helm-set image.registry=527582557964.dkr.ecr.us-east-1.amazonaws.com \
            --sync-policy automated \
            --auto-prune \
            --self-heal \
            --upsert

      - name: Sync ArgoCD Application
        run: |
          argocd app sync petclinic-dev --force --prune

      - name: Wait for sync
        run: |
          argocd app wait petclinic-dev --health --timeout 600
