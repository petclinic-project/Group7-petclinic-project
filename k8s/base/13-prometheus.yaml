apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-dev-prometheus-config
  namespace: petclinic-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets: ['localhost:9090']
    - job_name: api-gateway
      metrics_path: /actuator/prometheus
      static_configs:
      - targets: ['petclinic-dev-api-gateway:8080']
    - job_name: customers-service
      metrics_path: /actuator/prometheus
      static_configs:
      - targets: ['petclinic-dev-customers-service:8081']
    - job_name: visits-service
      metrics_path: /actuator/prometheus
      static_configs:
      - targets: ['petclinic-dev-visits-service:8082']
    - job_name: vets-service
      metrics_path: /actuator/prometheus
      static_configs:
      - targets: ['petclinic-dev-vets-service:8083']
    - job_name: admin-server
      metrics_path: /actuator/prometheus
      static_configs:
      - targets: ['petclinic-dev-admin-server:9090']
    - job_name: genai-service
      metrics_path: /actuator/prometheus
      static_configs:
      - targets: ['petclinic-dev-genai-service:8084']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-dev-prometheus
  namespace: petclinic-dev
  labels:
    app: petclinic-dev-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic-dev-prometheus
  template:
    metadata:
      labels:
        app: petclinic-dev-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
      volumes:
        - name: prometheus-config
          configMap:
            name: petclinic-dev-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-dev-prometheus
  namespace: petclinic-dev
spec:
  selector:
    app: petclinic-dev-prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
