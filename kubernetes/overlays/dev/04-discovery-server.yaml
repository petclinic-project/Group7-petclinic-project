apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-dev-discovery-server
  namespace: petclinic-dev
  labels:
    app: petclinic-dev-discovery-server
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: petclinic-dev-discovery-server
  template:
    metadata:
      labels:
        app: petclinic-dev-discovery-server
    spec:
      containers:
        - name: discovery-server
          image: 527582557964.dkr.ecr.us-east-1.amazonaws.com/petclinic-dev-discovery-server:latest
          ports:
            - containerPort: 8761
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "200m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://petclinic-dev-config-server:8888"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://petclinic-dev-config-server:8888"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://petclinic-dev-discovery-server:8761/eureka"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://petclinic-dev-zipkin:9411/api/v2/spans"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dspring.cloud.config.uri=http://petclinic-dev-config-server:8888 -Dspring.config.import=optional:configserver:http://petclinic-dev-config-server:8888"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-dev-discovery-server
  namespace: petclinic-dev
spec:
  selector:
    app: petclinic-dev-discovery-server
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761
